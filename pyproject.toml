[project]
name = "msaez2"
version = "0.1.0"
description = "Ontology-driven Event Storming & Impact Analysis Engine with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MSAez Team" }
]

dependencies = [
    # Neo4j Driver
    "neo4j>=5.0.0",

    # Postgres 직결 — 권한(og_grant)과 사용자·승인은 SQL 이라 Bolt(Cypher)로 못 간다.
    # 그래프 읽기·쓰기는 여전히 neo4j 드라이버가 맡는다.
    "psycopg[binary]>=3.1",
    
    # LangChain & LangGraph
    "langchain>=0.3.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "deepagents>=0.1.0",

    # FastAPI (for future API server)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.30",  # 고위험 3건 (보정 D · 2026-10-16)
    "sse-starlette>=2.1.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",

    # Optional (used by ingestion when uploading PDFs)
    "PyMuPDF>=1.23.0",

    # Tokenizer fallback for the ingestion token counter (spec 017).
    # Used only when LangChain's standardized usage_metadata is absent
    # (e.g. older provider adapters or self-hosted models).
    "tiktoken>=0.7.0",

    # DDD-for-SDD artifact generation (spec 022).
    # Jinja2: markdown templates for the article-format DDD artifacts.
    # python-slugify: ASCII-safe slugs from Korean BC / Aggregate names.
    "Jinja2>=3.1.0",
    "python-slugify>=8.0.0",

    # 2.4.0 was yanked for a backward-compatibility bug. Keep the packaged
    # runtime on the corrected 2.4 patch line instead of accepting it through
    # a transitive dependency.
    "numpy>=2.4.1,<2.5",

    # Robo-Spec MCP bridge (spec 029).
    # mcp: official Anthropic Python SDK — mounted in-process at /mcp.
    # watchfiles: backend file-watcher over <workspace>/specs/**/tasks.md
    # for the Design-tab progress reflection channel.
    "mcp>=1.0.0",
    "watchfiles>=0.24.0",

    # Claude Code terminal PTY backend on Windows (Code tab).
    # POSIX hosts use the stdlib `pty`/`fcntl`/`termios` modules; Windows
    # has no equivalent, so we drive ConPTY through pywinpty. The wheel is
    # prebuilt (no compiler needed) and the marker keeps it off Linux/macOS
    # installs entirely. See api/features/claude_code/pty_backend.py.
    "pywinpty>=2.0; sys_platform == 'win32'",
]

# 취약점 보정 D — **간접 의존성의 바닥**을 올린다 (2026-10-16).
#
# 보정 A 로 OS 를 치우니(Debian 12→13, 치명 9→2) 남은 치명·고위험 37건 중 36이
# pypi 였다. 여기 적힌 것은 전부 **직접 의존이 아니다** — 그래서 `dependencies` 가
# 아니라 제약으로 바닥만 올린다. 무엇을 쓰는지는 바뀌지 않고 버전만 올라간다.
#
# 측정값은 `docker scout cves --only-package-type pypi` 로 이미지에서 직접 쟀다.
[tool.uv]
constraint-dependencies = [
    "pyjwt>=2.14.0",            # 치명 1 + 고위험 5 — authority 의 토큰 검증
    "anyio>=4.14.2",            # 치명 1
    "pyasn1>=0.6.4",            # 고위험 5
    "urllib3>=2.8.0",           # 고위험 5
    "python-multipart>=0.0.30", # 고위험 3 (직접 의존에도 같이 올렸다)
    "aiohttp>=3.14.3",          # 고위험 2
    "orjson>=3.11.6",           # 고위험 1
    "jaraco-context>=6.1.0",    # 고위험 1 — setuptools 가 끌고 온다
    "wheel>=0.46.2",            # 고위험 1 — 빌드 때만 쓴다
]
# **일부러 올리지 않은 것 (고위험 11건)** — 미룬 이유를 같이 남긴다.
#
#   starlette 0.50.0 → 1.3.1  (고위험 2)
#       0.x → 1.x **메이저**다. fastapi 0.127 이 범위로 물고 있어 같이 올려야 한다.
#       웹 계층 전체 회귀 시험이 딸린다 — ISS-02(npm 메이저)와 같은 성격의 작업이다.
#   cryptography 48 → 50      (고위험 3)
#       메이저 **둘**이다. JWT·TLS 가 다 여기에 매달려 있다.
#   mcp 1.27.1 → 1.28.1       (고위험 3)
#   langchain-classic 1.0.1 → 1.0.7 · langgraph-sdk 0.3.1 → 0.4.4 ·
#   langsmith 0.8.5 → 0.8.18  (각 고위험 1)
#       **LLM 스택이다.** 지금 생성 품질(ISS-33·ISS-25)을 한 변수씩 재고 있는데
#       이걸 같이 올리면 결과 변화가 패치 때문인지 라이브러리 때문인지 **또 못 가린다**
#       (10-15 에 프롬프트와 모델이 겹쳐 하루를 되돌린 그 실수다 — done13 §246).
#       품질 검증이 끝나고, 한 번에, 따로 올린다.

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
msaez = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "[0-9][0-9][0-9]_*.py"]
testpaths = ["api/tests", "api/features"]
norecursedirs = ["desktop/resources/runtime", ".venv", "node_modules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

