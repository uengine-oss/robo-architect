[project]
name = "msaez2"
version = "0.1.0"
description = "Ontology-driven Event Storming & Impact Analysis Engine with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "MSAez Team" }
]

dependencies = [
    # Neo4j Driver
    "neo4j>=5.0.0",

    # Postgres 직결 — 권한(og_grant)과 사용자·승인은 SQL 이라 Bolt(Cypher)로 못 간다.
    # 그래프 읽기·쓰기는 여전히 neo4j 드라이버가 맡는다.
    "psycopg[binary]>=3.1",
    
    # LangChain & LangGraph
    "langchain>=0.3.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=0.2.0",
    # 보정 ⑤ (2026-10-19) — 1.2.2 → 1.2.16. **패치 올림이 자물쇠를 푼다**:
    # langgraph 1.2.2 가 `langgraph-sdk<0.4.0` 로 물고 있어 sdk 0.4.4 가 막혀
    # 있었다. 1.2.16 은 `langgraph-sdk<0.5.0,>=0.4.6` 을 요구한다(PyPI 에서 확인).
    "langgraph>=1.2.16",
    "langgraph-checkpoint>=2.0.0",
    "deepagents>=0.1.0",

    # FastAPI (for future API server)
    #
    # 취약점 보정 ⑤-2 (2026-10-19) — 0.115 → 0.146 바닥. **starlette 를 풀기 위해서다.**
    # 0.127.0 이 `starlette<0.51.0` 으로 물고 있어 starlette 1.3.1 이 막혀 있었다.
    # 0.146.0 은 `starlette>=0.46.0` 으로 **상한이 없다**(PyPI 에서 확인).
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.30",  # 고위험 3건 (보정 D · 2026-10-16)

    # 취약점 보정 D — **간접 의존성의 바닥**을 여기에 적는다 (2026-10-16).
    #
    # 보정 A 로 OS 를 치우니(Debian 12→13, 치명 9→2) 남은 치명·고위험 37건 중
    # 36이 pypi 였다. 아래 여덟은 **우리가 직접 import 하지 않는다** — 다른
    # 패키지가 끌고 오는 것이고, 버전만 올리면 고쳐지는 것들이다.
    #
    # `[tool.uv] constraint-dependencies` 로 적었다가 **포장 런타임이 깨졌다**:
    # `uv pip install --require-hashes` 는 범위를 거부하는데 제약은 범위다.
    # 직접 의존으로 적으면 잠금 파일이 `==` 로 풀어 주고 해시도 붙는다.
    "pyjwt>=2.14.0",            # 치명 1 + 고위험 5 — authority 의 토큰 검증
    "anyio>=4.14.2",            # 치명 1
    "pyasn1>=0.6.4",            # 고위험 5
    "urllib3>=2.8.0",           # 고위험 5
    "aiohttp>=3.14.3",          # 고위험 2
    "orjson>=3.11.6",           # 고위험 1
    "jaraco-context>=6.1.0",    # 고위험 1 — setuptools 가 끌고 온다
    "wheel>=0.46.2",            # 고위험 1 — 빌드 때만 쓴다
    #
    # ⚠ 위 둘은 **더 올릴 자리가 없다.** 2026-10-19 에 이미지를 열어 보니 걸린 사본이
    #   `site-packages/setuptools/_vendor/jaraco.context-5.3.0` 과 `.../wheel-0.45.1`
    #   이다 — **베이스 이미지의 setuptools 가 품고 있는 사본**이라 우리 바닥이
    #   닿지 않는다(우리 venv 는 이미 wheel 0.48.0 이다). 그쪽은 보정 ⑥ 이다.
    #
    # ── 보정 ⑤ (2026-10-19) — **미뤘던 LLM 스택을 올린다** ──────────────────
    #
    # 위에서 "품질 검증이 끝나고, 한 번에, 따로 올린다" 고 적어 미뤘다.
    # **그 조건이 풀렸다** — 적재 쪽 검증이 끝났다(done14 §283: 교착을 닫고 모달
    # 다섯 줄을 정리했으며 "다시 돌릴 이유가 없다"). 그래서 지금 한 번에 올린다.
    #
    # 상한을 먼저 확인했다(이미지 안의 METADATA 를 읽어서):
    #   cryptography       google-auth `>=38.0.3` · pyjwt `>=3.4.0`  → **상한 없음**
    #   mcp                anthropic `>=1.0`                         → **상한 없음**
    #   langchain-classic  langchain-community `<2.0.0,>=1.0.0`      → 1.0.7 은 범위 안
    #   langsmith          langchain-core/community/classic `<1.0.0` → 0.8.18 은 범위 안
    "cryptography>=50.0.0",     # 고위험 3 — 메이저 둘이지만 아무도 상한을 안 걸었다
    # 고위험 3. ⚠ **상한을 건다.** `>=1.28.1` 만 적으면 uv 가 최신인 **2.3.0**(메이저)을
    # 집는다. CVE 는 1.28.1 에서 고쳐지므로 메이저를 넘을 이유가 없고, 우리는 이것을
    # **직접 쓴다** — `features/robo_spec/mcp_server.py` 가
    # `from mcp.server.fastmcp import FastMCP` 를 한다(지연 import 라 기동 때 안 터진다).
    # 2.x 로 올릴 때는 그 자리를 보고 따로 올린다.
    "mcp>=1.28.1,<2",
    "langchain-classic>=1.0.7", # 고위험 1
    "langsmith>=0.8.18",        # 고위험 1
    "langgraph-sdk>=0.4.6",     # 고위험 1 — langgraph 1.2.16 이 요구하는 바닥
    #
    # 보정 ⑤-2 (2026-10-19) — starlette. 위 fastapi 바닥과 **한 쌍이다.**
    #   CVE-2026-48818(SSRF · `<1.1.0`) · CVE-2026-54283(자원 제한 없음 · `<1.3.1`).
    #   0.x → 1.x **메이저**이고 우리 코드 **78 파일**이 직접 import 한다
    #   (대부분 `starlette.requests.Request`, 그 밖에 `middleware.base.BaseHTTPMiddleware`·
    #    `responses.{JSONResponse,StreamingResponse,Response}`·`types.ASGIApp`).
    #   그래서 **바닥 한 줄로 끝내지 않고 돌려 봤다** — 검사 2,073개를 올리기 전과
    #   후로 대조했다(done14 §287 에 숫자).
    "starlette>=1.3.1",
    "sse-starlette>=2.1.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",

    # Optional (used by ingestion when uploading PDFs)
    "PyMuPDF>=1.23.0",

    # Tokenizer fallback for the ingestion token counter (spec 017).
    # Used only when LangChain's standardized usage_metadata is absent
    # (e.g. older provider adapters or self-hosted models).
    "tiktoken>=0.7.0",

    # DDD-for-SDD artifact generation (spec 022).
    # Jinja2: markdown templates for the article-format DDD artifacts.
    # python-slugify: ASCII-safe slugs from Korean BC / Aggregate names.
    "Jinja2>=3.1.0",
    "python-slugify>=8.0.0",

    # 2.4.0 was yanked for a backward-compatibility bug. Keep the packaged
    # runtime on the corrected 2.4 patch line instead of accepting it through
    # a transitive dependency.
    "numpy>=2.4.1,<2.5",

    # Robo-Spec MCP bridge (spec 029).
    # mcp: official Anthropic Python SDK — mounted in-process at /mcp.
    # watchfiles: backend file-watcher over <workspace>/specs/**/tasks.md
    # for the Design-tab progress reflection channel.
    "mcp>=1.0.0",
    "watchfiles>=0.24.0",

    # Claude Code terminal PTY backend on Windows (Code tab).
    # POSIX hosts use the stdlib `pty`/`fcntl`/`termios` modules; Windows
    # has no equivalent, so we drive ConPTY through pywinpty. The wheel is
    # prebuilt (no compiler needed) and the marker keeps it off Linux/macOS
    # installs entirely. See api/features/claude_code/pty_backend.py.
    "pywinpty>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
msaez = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "[0-9][0-9][0-9]_*.py"]
testpaths = ["api/tests", "api/features"]
norecursedirs = ["desktop/resources/runtime", ".venv", "node_modules"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

