services:
  neo4j:
    image: ${ROBO_IMAGE_NEO4J}
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: neo4j
    ports:
      - "127.0.0.1:${ROBO_NEO4J_PORT}:7687"
    environment:
      NEO4J_AUTH: neo4j/${ROBO_NEO4J_PASSWORD}
      ROBO_NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p \"$$ROBO_NEO4J_PASSWORD\" \"RETURN 1\" >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ⚠ **mindsdb 서비스를 걷어냈다** (ontological 데이터 패브릭 가지).
  #
  # 이 제품은 데이터 소스 연합을 MindsDB 라는 **남의 제품**에 맡기고 있었다.
  # 그 이미지 하나가 치명·고위험 **231건**을 들고 있었고, 공개된 판 872개를
  # 전부 확인해도 **고친 판이 없었다**. 그래서 쓰지 않는 길을 만들었다 —
  # 연합을 **그래프 데이터베이스가 직접** 한다(Ontological 의 virtual fabric).
  #
  # ⚠ **아직 끝이 아니다.** 이 가지의 그래프 저장소는 여전히 `neo4j` 인데,
  #   새 패브릭 문장(`CREATE DATASOURCE` 따위)은 **Ontological 엔진만** 알아듣는다.
  #   그 교체(neo4j → graph-db + graph-bolt)가 **다음 단계**다.
  #   그 전까지 이 가지에서 **데이터 소스 기능은 돌지 않는다.**

  fabric:
    image: ${ROBO_IMAGE_FABRIC}
    env_file:
      - ./config/fabric.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: fabric
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      DATA_FABRIC_ALLOW_NEO4J_HEADER_OVERRIDE: "false"
      # 사람이 적는 `localhost` 는 자기 PC 다. 원천에 실제로 붙는 쪽은 **그래프 DB
      # 컨테이너**이므로 바꿔 준다(예전 `MINDSDB_REPLACE_LOCALHOST` 자리).
      ROBO_DATASOURCE_REPLACE_LOCALHOST: host.docker.internal
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8404/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  catalog:
    image: ${ROBO_IMAGE_CATALOG}
    env_file:
      - ./config/catalog.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: catalog
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      DATA_FABRIC_URL: http://fabric:8404
      CATALOG_ALLOW_NEO4J_HEADER_OVERRIDE: "false"
    depends_on:
      neo4j:
        condition: service_healthy
      fabric:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5503/robo/check-data/', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  analyzer:
    image: ${ROBO_IMAGE_ANALYZER}
    env_file:
      - ./config/analyzer.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: analyzer
    ports:
      - "127.0.0.1:${ROBO_ANALYZER_PORT}:5502"
    environment:
      ROBO_NEO4J_URI: bolt://neo4j:7687
      ROBO_NEO4J_USER: neo4j
      ROBO_NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      ROBO_NEO4J_DATABASE: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      ROBO_CATALOG_BASE_URL: http://catalog:5503/robo
      ROBO_DATA_DIR: /data
    volumes:
      - shared_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5502/', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  parser:
    image: ${ROBO_IMAGE_PARSER}
    env_file:
      - ./config/parser.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: parser
    environment:
      SERVER_PORT: "8081"
      ROBO_DATA_DIR: /data
    volumes:
      - shared_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    image: ${ROBO_IMAGE_GATEWAY}
    env_file:
      - ./config/gateway.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: gateway
    ports:
      - "127.0.0.1:${ROBO_GATEWAY_PORT}:9000"
    environment:
      SERVER_PORT: "9000"
      ROBO_ANTLR_URL: http://parser:8081
      ROBO_ANALYZER_URL: http://analyzer:5502
      ROBO_CATALOG_URL: http://catalog:5503
      ROBO_DATA_FABRIC_URL: http://fabric:8404
      ROBO_ARCHITECT_URL: http://host.docker.internal:${ROBO_ARCHITECT_API_PORT}
    depends_on:
      analyzer:
        condition: service_healthy
      catalog:
        condition: service_healthy
      fabric:
        condition: service_healthy
      parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

volumes:
  neo4j_data:
  neo4j_logs:
  # ⚠ `mindsdb_data:` 를 선언에서 뺐다. **도커 볼륨 자체는 지우지 않는다** —
  #   이미 깔린 PC 에 남아 있고, 되돌릴 때 쓸 유일한 길이다.
  shared_data:
