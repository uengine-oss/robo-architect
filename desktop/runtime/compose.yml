services:
  # graph-db — **저장소는 Ontological 이다. Neo4j 가 아니다.**
  #
  # 왜 바꿨나: `neo4j:5.26.0` 은 **Community** 라 database 를 하나만 가진다.
  #   CREATE DATABASE  →  Unsupported administration command  (2026-09-17 실측)
  # 그래서 설계 graph 와 분석 graph 를 나눌 수 없었다. 분석은 대상 graph 를 통째로
  # 비우고 다시 쓰므로, 나눌 수 없다는 것은 **분석이 설계를 지운다**는 뜻이다.
  # Ontological 은 `og_create_graph` 로 graph 를 얼마든지 만든다.
  #
  # 앱 코드는 안 바뀐다 — Bolt 게이트웨이가 Neo4j 프로토콜을 그대로 말한다.
  graph-db:
    image: ${ROBO_IMAGE_GRAPH_DB}
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: graph-db
    environment:
      POSTGRES_USER: ${ROBO_GRAPH_USER}
      POSTGRES_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      POSTGRES_DB: ${ROBO_GRAPH_DESIGN}
      # 엔트리포인트 훅이 둘 다 만들고, **같으면 거기서 멈춘다**(설계가 지워지는 구성).
      OG_GRAPH_DESIGN: ${ROBO_GRAPH_DESIGN}
      OG_GRAPH_ANALYSIS: ${ROBO_GRAPH_ANALYSIS}
    ports:
      # Architect API 는 Windows 호스트에서 실행되므로 사용자/프로젝트 저장소에
      # 직접 접속할 수 있어야 한다. PostgreSQL 도 Bolt 와 마찬가지로 루프백에만 연다.
      - "127.0.0.1:${ROBO_GRAPH_PG_PORT}:5432"
    volumes:
      - graph_data:/var/lib/postgresql/data
    healthcheck:
      # **떴는지만 본다.** 확장이 깔렸고 graph 가 있는지는 기능 프로브가 따로 잰다
      # (`scripts/probe_runtime.py`). healthcheck 가 준비의 근거가 아니다 — 같은
      # healthy 상태에서 실제 일은 못 하는 경우를 09-17 에 쟀다.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -q"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # graph-bolt — Neo4j Bolt 프로토콜 게이트웨이. **상태를 갖지 않는다.**
  #
  # 왜 별도 컨테이너인가: 받은 질의를 전부 `og_cypher()` 로 넘길 뿐이라 Postgres 와
  # 묶을 이유가 없다. 묶으면 공식 postgres 엔트리포인트(initdb·PGDATA·시그널)를
  # 우리가 다시 만들어야 하고, 무엇보다 **Bolt 를 사람이 띄우게 된다** — 이 저장소가
  # 반복해 밟은 함정이 거기서 나왔다(엔진을 다시 깔고 Bolt 를 안 띄워 psql 은 되는데
  # 앱만 죽는 상태). 별도 서비스로 두면 수명을 compose 가 쥔다.
  graph-bolt:
    image: ${ROBO_IMAGE_GRAPH_BOLT}
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: graph-bolt
    ports:
      # **루프백에만 연다.** Bolt 는 평문 인증이다.
      - "127.0.0.1:${ROBO_NEO4J_PORT}:7687"
    environment:
      OG_BOLT_LISTEN: 0.0.0.0:7687
      OG_BOLT_PGHOST: graph-db
      OG_BOLT_PGPORT: "5432"
      OG_BOLT_PGDATABASE: ${ROBO_GRAPH_DESIGN}
      OG_BOLT_GRAPH: ${ROBO_GRAPH_DESIGN}
      PGPASSWORD: ${ROBO_NEO4J_PASSWORD}
    depends_on:
      graph-db:
        condition: service_healthy
    healthcheck:
      # 포트가 응답하는지만 본다. 실제로 질의가 도는지는 기능 프로브가 잰다.
      #
      # **`CMD-SHELL` 을 쓰지 않는다** — 그건 `/bin/sh`(= dash)로 돌고 dash 에는
      # `/dev/tcp` 가 없다. 처음에 그렇게 썼다가 Bolt 가 멀쩡한데 unhealthy 로
      # 떴고, 의존 서비스 넷이 `Created` 에서 멈췄다. **앱이 아니라 검사가 틀린**
      # 경우다. bash 로 명시한다.
      #
      # 게이트웨이는 `0.0.0.0:7687` 에 바인드하므로 IPv4 확인으로 충분하다.
      # (IPv6 전용 바인딩이면 이 방식이 거짓 음성을 낸다 — 그때는 방식을 바꾼다.)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7687"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mindsdb:
    image: ${ROBO_IMAGE_MINDSDB}
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: mindsdb
    environment:
      MINDSDB_APIS: http
      MINDSDB_DOCKER_ENV: "True"
      MINDSDB_STORAGE_DIR: /mindsdb/var
      SENTRY_IO_DSN: ""
    volumes:
      - mindsdb_data:/mindsdb/var
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:47334/api/util/ping"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  fabric:
    image: ${ROBO_IMAGE_FABRIC}
    env_file:
      - ./config/fabric.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: fabric
    environment:
      NEO4J_URI: bolt://graph-bolt:7687
      NEO4J_USER: ${ROBO_GRAPH_USER}
      NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS}
      # **켜 둔다.** 화면이 프로젝트마다 다른 graph 를 보려면 이 스위치가 필요하다.
      # 끄면 헤더를 실은 요청이 403 이다. 그런데 화면이 실제로 보내는 헤더는
      # `X-Neo4j-Database` 하나(브라우저는 연결 자격을 안 들고 있다)이고, 예전에는
      # 그 갈래가 `from_headers` 에서 `None` 이 되어 **403 도 안 나고 조용히 무시**됐다
      # — 매 요청이 아래 `NEO4J_DATABASE` 로 갔다. 그 갈래를 고친 것과 **짝이다**
      # (catalog `graph/connection.py` · fabric `registry/connection.py`).
      # 한쪽만 들어가면: 고침만 = 화면이 403, 스위치만 = 지금처럼 조용히 무시.
      DATA_FABRIC_ALLOW_NEO4J_HEADER_OVERRIDE: "true"
      MINDSDB_URL: http://mindsdb:47334
      MINDSDB_REPLACE_LOCALHOST: host.docker.internal
      # ── 모델 키는 이미지에도 설치본에도 굽지 않는다 ──────────────────
      #
      # 예전에는 `config/*.env` 안에 값이 그대로 들어 있었다. 릴리스가
      # `robo-workspace/.env` 를 베껴 썼기 때문이다. 2026-09-23 설치본을
      # 감사해 보니 **같은 OpenAI 키가 5개 파일 7개 이름으로** 실려 있었다 —
      # 고객에게 나가는 설치 파일 안에 개발사 모델 키가 있었다는 뜻이다.
      #
      # 이제 릴리스가 그 이름들을 빼고(`robo.ps1`
      # `Write-ReleaseEnvironmentSnapshots`), 설치한 사람이 환경변수로 넣은
      # 값을 **여기서** 컨테이너로 넘긴다. compose 는 `environment:` 가
      # `env_file:` 을 이기므로, 옛 설치본의 파일 값이 남아 있어도 이쪽이
      # 우선한다.
      #
      # `:-` 를 붙여 비어 있을 때 경고 없이 빈 값으로 두되, **비었다는 사실은
      # 앱이 기동에서 이름을 대고 말한다**(`docker-stack.ts` 의
      # `assertCredentialsPresent`). 여기서 조용히 비는 것이 제일 나쁘다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      graph-bolt:
        condition: service_healthy
      mindsdb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8404/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  catalog:
    image: ${ROBO_IMAGE_CATALOG}
    env_file:
      - ./config/catalog.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: catalog
    environment:
      NEO4J_URI: bolt://graph-bolt:7687
      NEO4J_USER: ${ROBO_GRAPH_USER}
      NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS}
      DATA_FABRIC_URL: http://fabric:8404
      # **켜 둔다.** 화면이 프로젝트마다 다른 graph 를 보려면 이 스위치가 필요하다.
      # 끄면 헤더를 실은 요청이 403 이다. 그런데 화면이 실제로 보내는 헤더는
      # `X-Neo4j-Database` 하나(브라우저는 연결 자격을 안 들고 있다)이고, 예전에는
      # 그 갈래가 `from_headers` 에서 `None` 이 되어 **403 도 안 나고 조용히 무시**됐다
      # — 매 요청이 아래 `NEO4J_DATABASE` 로 갔다. 그 갈래를 고친 것과 **짝이다**
      # (catalog `graph/connection.py` · fabric `registry/connection.py`).
      # 한쪽만 들어가면: 고침만 = 화면이 403, 스위치만 = 지금처럼 조용히 무시.
      CATALOG_ALLOW_NEO4J_HEADER_OVERRIDE: "true"
      # 모델 키는 굽지 않고 호스트 환경에서 받는다 — 근거는 `fabric` 참고.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      graph-bolt:
        condition: service_healthy
      fabric:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5503/robo/check-data/', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  analyzer:
    image: ${ROBO_IMAGE_ANALYZER}
    env_file:
      - ./config/analyzer.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: analyzer
    ports:
      - "127.0.0.1:${ROBO_ANALYZER_PORT}:5502"
    environment:
      ROBO_NEO4J_URI: bolt://graph-bolt:7687
      ROBO_NEO4J_USER: ${ROBO_GRAPH_USER}
      ROBO_NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      ROBO_NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS}
      NEO4J_URI: bolt://graph-bolt:7687
      NEO4J_USER: ${ROBO_GRAPH_USER}
      NEO4J_PASSWORD: ${ROBO_NEO4J_PASSWORD}
      NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS}
      ROBO_CATALOG_BASE_URL: http://catalog:5503/robo
      ROBO_DATA_DIR: /data
      # 모델 키는 굽지 않고 호스트 환경에서 받는다 — 근거는 `fabric` 참고.
      ROBO_LLM_API_KEY: ${ROBO_LLM_API_KEY:-}
      ROBO_EMBED_API_KEY: ${ROBO_EMBED_API_KEY:-}
      ROBO_SEARCH_LLM_API_KEY: ${ROBO_SEARCH_LLM_API_KEY:-}
    volumes:
      - shared_data:/data
    depends_on:
      graph-bolt:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5502/', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  parser:
    image: ${ROBO_IMAGE_PARSER}
    env_file:
      - ./config/parser.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: parser
    environment:
      SERVER_PORT: "8081"
      ROBO_DATA_DIR: /data
      # 모델 키는 굽지 않고 호스트 환경에서 받는다 — 근거는 `fabric` 참고.
      # 복구 에이전트를 안 쓰면 비어 있어도 된다(파싱 자체는 LLM 을 안 탄다).
      PARSER_REPAIR_AGENT_API_KEY: ${PARSER_REPAIR_AGENT_API_KEY:-}
    volumes:
      - shared_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    image: ${ROBO_IMAGE_GATEWAY}
    env_file:
      - ./config/gateway.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: gateway
    ports:
      - "127.0.0.1:${ROBO_GATEWAY_PORT}:9000"
    environment:
      SERVER_PORT: "9000"
      ROBO_ANTLR_URL: http://parser:8081
      ROBO_ANALYZER_URL: http://analyzer:5502
      ROBO_CATALOG_URL: http://catalog:5503
      ROBO_DATA_FABRIC_URL: http://fabric:8404
      ROBO_ARCHITECT_URL: http://host.docker.internal:${ROBO_ARCHITECT_API_PORT}
    depends_on:
      analyzer:
        condition: service_healthy
      catalog:
        condition: service_healthy
      fabric:
        condition: service_healthy
      parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # pdf2bpmn — **문서에서 BPMN 을 뽑는 서비스. 사내망에서는 바깥을 못 부른다.**
  #
  # 지금까지 이 호출은 `https://pdf2bpmn.process-gpt.io` 로 나갔다. 사내망에서는
  # 막힌다. 그래서 같이 말아 넣는다.
  #
  # **"막히면 native 가 빈 결과를 낸다"는 틀렸다 (2026-09-17 정정).** 그 실측은
  # 본문이 비어 있을 때의 값이었다. 본문을 넣으면 native 도 그럴듯한 BPM 을 낸다.
  #
  #   facade 를 401 로 죽여 놓고 6796자 문서를 넣었더니
  #   → source=native · task 7 · gateway 2 · 이름도 멀쩡하다
  #   (09-16 실측도 같은 말을 했다: 폴백 task 8 · gateway 2 / facade 6 · 2)
  #
  # **이것이 더 위험하다.** 결과물로는 못 가린다 — 우리 컨테이너가 놀아도 화면에는
  # 그럴듯한 BPM 이 나온다. 자체 호스팅의 근거는 품질이 아니라 **사내망에서 바깥을
  # 못 부른다**는 것 하나이고, 출처는 **결과물이 아니라 기록으로만** 가른다.
  #
  # ## 왜 컨테이너 하나인가
  #
  # Architect 가 실제로 쓰는 경로는 `POST /api/consulting-bpmn` 하나뿐이고,
  # 그 경로는 **Neo4j·Supabase·Memento·업스트림 API 를 하나도 안 탄다** — 순수
  # LLM 계산이다. 업로드·잡·폴링 흐름은 클라이언트에 메서드만 있고 안 쓴다.
  #
  # ## facade.py 는 이미지 밖에 둔다
  #
  # 이미지(2.06GB)를 다시 굽지 않고 고칠 수 있다. k8s 쪽은 같은 코드를
  # ConfigMap 으로 넣는데, 여기서는 파일 하나를 마운트한다.
  #
  # ## `entrypoint` 로 덮어야 한다
  #
  # 이미지의 `entrypoint.sh` 는 자기 스택(run.py api + a2a_server)을 띄운다.
  # `command:` 만 주면 그게 그대로 돌고 **우리 앱은 안 뜬다** — 컨테이너는
  # running 인데 포트가 닫혀 있고 오류도 안 난다. k8s 의 `command:` 는
  # ENTRYPOINT 를 덮지만 compose 의 `command:` 는 CMD 만 덮는다.
  pdf2bpmn:
    image: ${ROBO_IMAGE_PDF2BPMN}
    platform: linux/amd64
    env_file:
      - ./config/pdf2bpmn.env
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: pdf2bpmn
    entrypoint: ["sh", "-c", "cd /app && PYTHONPATH=/app:/facade exec uvicorn facade:app --host 0.0.0.0 --port 8080"]
    volumes:
      - ./pdf2bpmn/facade.py:/facade/facade.py:ro
    environment:
      PYTHONIOENCODING: utf-8
      # 모델 키는 굽지 않고 호스트 환경에서 받는다 — 근거는 `fabric` 참고.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # **facade 의 공유 시크릿은 모델 키가 아니다.**
      # 예전 설치본에서는 이 값이 `OPENAI_API_KEY` 와 **글자 하나까지 같았다**
      # (실측 fp 일치). 공유 시크릿으로 모델 키를 재사용한 것이라, 이 파일을
      # 읽을 수 있는 사람은 모델 키도 읽는다.
      #
      # 이름도 하나로 모은다. Architect 쪽은 `PDF2BPMN_FACADE_KEY`, 컨테이너
      # 쪽은 `FACADE_API_KEY` 라 **둘이 같아야 하는데 이름이 달랐고**, 그래서
      # 한쪽만 채우면 401 이 나고 Architect 는 조용히 폴백으로 내려갔다.
      # 이제 설치한 사람은 `PDF2BPMN_FACADE_KEY` 하나만 정하면 된다.
      FACADE_API_KEY: ${PDF2BPMN_FACADE_KEY:-}
    ports:
      # **루프백에만 연다.** 0.0.0.0 이면 같은 망의 아무나 이 LLM 을 쓴다.
      - "127.0.0.1:${ROBO_PDF2BPMN_PORT}:8080"
    healthcheck:
      # `/healthz` 는 인증 없이 열려 있다(facade.py 의 미들웨어가 예외로 둔다).
      # **떴다는 것만 말해 준다** — 실제로 BPMN 이 나오는지는 별도로 잰다
      # (`scripts/verify_pdf2bpmn_selfhosted.py`).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # wireframe — **open-pencil 렌더러. 없으면 와이어프레임 단계가 조용히 빈다.**
  #
  # Architect 의 와이어프레임 에이전트가 JSX 를 만들어 `/render` 로 넘기면
  # SerializedSceneGraph 가 돌아온다. **LLM 은 이 컨테이너에서 안 돈다** — 모델
  # 호출은 호스트 백엔드 쪽이고, 여기는 렌더링만 한다. 그래서 키가 필요 없다.
  #
  # ## 왜 뒤늦게 들어왔나 — 빠져 있어도 아무도 못 알아챈다
  #
  # `dev.sh` 는 이 서비스를 Bun 으로 띄우지만(포트 7610) 설치본은 안 띄웠다.
  # 그런데 그 부재가 **오류로 안 보인다**: `run_render_agent` 는 서비스가 없으면
  # `(None, None)` 을 내는데, 인제스천 경로는 `on_event=None` 으로 부르므로
  # 그 error 이벤트가 아무 데도 안 간다. 화면에는 "UI 와이어프레임 생성 중…" 과
  # "UI 생성: <이름>" 이 그대로 흐르고, UI 노드는 `sceneGraph=null` 로 남는다.
  # 그 다음 Figma 싱크가 UI 마다 "이 UI 노드에는 아직 sceneGraph가 없습니다" 로
  # 죽는다 — **증상은 Figma 에서 나오는데 원인은 여기에 있다.**
  #
  # 2026-09-23 실측(같은 입력, 렌더러만 추가):
  #   없을 때  와이어프레임  0/27 · Figma 프레임  0
  #   있을 때  와이어프레임 29/29 · Figma 프레임 28/29
  wireframe:
    image: ${ROBO_IMAGE_WIREFRAME}
    restart: unless-stopped
    labels:
      org.uengine.robo.release: ${ROBO_RELEASE_ID}
      org.uengine.robo.component: wireframe
    environment:
      WIREFRAME_SERVICE_PORT: "7610"
      # 이미지가 굽힐 때 같이 들어간다(open-pencil `docs/components.fig`).
      COMPONENT_LIBRARY_PATH: /app/docs/components.fig
    ports:
      # **루프백에만 연다.** Architect API 는 Windows 호스트에서 돌므로 호스트
      # 포트가 있어야 닿는다 — analyzer·gateway·pdf2bpmn 과 같은 이유다.
      - "127.0.0.1:${ROBO_WIREFRAME_PORT}:7610"
    healthcheck:
      # **`oven/bun:1.4-slim` 에는 curl·wget·nc 가 하나도 없다**(실측). 도구를
      # 더해 이미지를 키우는 대신 bun 으로 잰다. `/health` 는 컴포넌트 카탈로그를
      # 실제로 읽은 뒤에야 `status:ok` 를 내므로, 포트만 열린 상태와 구분된다.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:7610/health');if(!r.ok)process.exit(1);const j=await r.json();process.exit(j.status==='ok'?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  graph_data:
  mindsdb_data:
  shared_data:
