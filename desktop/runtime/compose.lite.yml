# desktop **lite 프로필**의 overlay — `compose.yml` 위에 얹는다(docker-stack.ts `composeArgs`).
#
# 판은 web · desktop 둘이고 lite 는 desktop 의 한 프로필이다(desktop-profile.ts). compose 도
# 따로 두지 않는다: 바탕은 `compose.yml` 하나이고, lite 에서 **달라지는 것만** 여기 적는다.
# enterprise(기본)는 이 파일을 싣지 않는다.
#
# ⚠ `!reset` 은 compose v2.24.4 이상이다(Docker Desktop 4.27+).
#
# 문서→BPMN(pdf2bpmn)은 **끄지 않는다** — lite 는 main 과 같은 스펙이다(main 개발은
# deploy/pdf2bpmn-selfhosted 컨테이너 하나 · OpenAI gpt-4o). 이미지·`config/pdf2bpmn.env`·
# `pdf2bpmn/facade.py` 는 lite 굽기(scripts/packaged-runtime-common.sh)가 싣는다.
# (11-17 통합 때 여기서 꺼 두었던 것은 잘못이었다 — 0.1.5 홈에 "문서→BPMN 생성기 멈춤".)

services:
  # 분석기·검색 LLM 은 이 PC 의 Claude Code 다리(`claude_code_bridge`)다. 그 설정은
  # `config/analyzer.env` 에 `ROBO_LLM_API_KEY=claude-code-bridge` 로 들어 있는데,
  # `compose.yml` 의 `environment:`(`${ROBO_LLM_API_KEY:-}`)가 env_file 을 이겨 **빈 값으로
  # 덮는다.** 여기서 기본값을 다리 값으로 되돌린다. 키를 넣은 사람은 그 값이 이긴다.
  analyzer:
    environment:
      ROBO_LLM_API_KEY: ${ROBO_LLM_API_KEY:-claude-code-bridge}
      ROBO_SEARCH_LLM_API_KEY: ${ROBO_SEARCH_LLM_API_KEY:-claude-code-bridge}
