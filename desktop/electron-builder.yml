appId: org.uengine.robo-architect
productName: Robo-Architect
copyright: Copyright (c) ${author}

directories:
  output: out/dist
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/__tests__/**"

# 프런트 정적 산출물 — 앱은 `app.getAppPath()/../frontend/dist` 에서 찾는다
# (index.ts resolveFrontendDist). asar 안에 넣으면 그 경로가 아니므로 resources/ 로 뺀다:
#   packaged: <win-unpacked>/resources/frontend/dist   ← app.asar 의 ".." 가 resources
#   dev     : <repo>/frontend/dist                     ← desktop 의 ".."
# 이게 없으면 앱이 "Not Found" 만 띄운다(실측).
extraResources:
  - from: ../frontend/dist
    to: frontend/dist
    filter: ["**/*"]
  # **이미지 tar 는 일부러 뺀다.** 넣으면 NSIS 가 설치본을 못 만든다 —
  # `makensis` 는 32비트(실측)라 주소공간이 2GB 남짓인데 tar 하나가 2.5GB 다.
  # 2026-09-23 실측: 페이로드 3.27GB 에서 `failed creating mmap of …nsis.7z`.
  # 이미지를 줄여 넘길 수 있는 벽이 아니다(analyzer 한 장이 2.1GB).
  # tar 는 설치 파일 옆에 함께 전달하고, 앱이 `resolveImageArchive` 로 찾는다.
  - from: resources/runtime
    to: runtime
    filter: ["**/*", "!robo-images.tar"]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 코드 서명 인증서가 없다(내부 배포). 이 단계가 켜져 있으면 electron-builder 가
  # winCodeSign 툴체인을 받아 exe 리소스를 편집·서명하는데, 그 아카이브에 심볼릭 링크가 있어
  # Windows 에서 압축 해제가 실패한다(Sub items Errors). 서명을 안 할 거면 켤 이유가 없다.
  # 서명 도입 시(US1/T029) 이 줄을 지우고 인증서를 지정한다.
  signAndEditExecutable: false

nsis:
  perMachine: false        # per-user install — no admin elevation required
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
  # Build the uninstaller inside the final installer. This avoids executing an
  # intermediate unsigned EXE, which enterprise App Control can block.
  script: installer.nsi

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# Signing + notarize blocks are added in US1/T029.
# `publish` (update-feed) is added in US2/T032.
