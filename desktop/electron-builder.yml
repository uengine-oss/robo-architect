appId: org.uengine.robo-architect-lite
productName: Robo Architect Lite
# The installed app's name for Electron (app.getName → ~/Library/Application Support/Robo Architect Lite,
# the "Robo Architect Lite Safe Storage" keychain item). package.json keeps the development name, so a
# development run and an installed copy never share a data folder.
extraMetadata:
  productName: Robo Architect Lite
copyright: Copyright (c) ${author}

directories:
  output: out/dist
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - "!**/*.map"
  - "!**/__tests__/**"

# 프런트 정적 산출물 — 앱은 `app.getAppPath()/../frontend/dist` 에서 찾는다
# (index.ts resolveFrontendDist). asar 안에 넣으면 그 경로가 아니므로 resources/ 로 뺀다:
#   packaged: <win-unpacked>/resources/frontend/dist   ← app.asar 의 ".." 가 resources
#   dev     : <repo>/frontend/dist                     ← desktop 의 ".."
# 이게 없으면 앱이 "Not Found" 만 띄운다(실측).
extraResources:
  - from: ../frontend/dist
    to: frontend/dist
    filter: ["**/*"]
  # scripts/build-packaged-runtime.sh (macOS) / build-packaged-runtime.ps1 (Windows):
  # manifest, compose, service settings, bundled Python + Architect API
  - from: resources/runtime
    to: runtime
    filter: ["**/*", "!.gitkeep", "!**/.DS_Store", "!architect/requirements.lock.txt"]
  # 창 셸(탭 줄 + 홈) — main/index.ts resolveShellDir 가 resources/shell 에서 찾는다
  - from: resources/shell
    to: shell
    filter: ["**/*"]
  # 영어 모드 — 런타임 번역기 + 사전 (main/lang.ts i18nDir 가 resources/i18n 에서 찾는다)
  - from: resources/i18n
    to: i18n
    filter: ["translate.js", "ko-en.json", "en.css"]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/icon.ico
  artifactName: Robo-Architect-Lite-win-${arch}.${ext}
  # 코드 서명 인증서가 없다(내부 배포). 이 단계가 켜져 있으면 electron-builder 가
  # winCodeSign 툴체인을 받아 exe 리소스를 편집·서명하는데, 그 아카이브에 심볼릭 링크가 있어
  # Windows 에서 압축 해제가 실패한다(Sub items Errors). 서명을 안 할 거면 켤 이유가 없다.
  # 서명 도입 시(US1/T029) 이 줄을 지우고 인증서를 지정한다.
  signAndEditExecutable: false

nsis:
  perMachine: false        # per-user install — no admin elevation required
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: Robo-Architect-Lite-Setup-win-x64.${ext}
  # Build the uninstaller inside the final installer. This avoids executing an
  # intermediate unsigned EXE, which enterprise App Control can block.
  script: installer.nsi

# macOS (Apple Silicon): a DMG with a fixed name, so the website can link
#   https://github.com/uengine-oss/robo-architect-lite-releases/releases/latest/download/Robo-Architect-Lite-mac-arm64.dmg
# Build: scripts/build-packaged-runtime.sh, then `npm run dist:mac` (desktop/scripts/release/README.md).
mac:
  target:
    - target: dmg
      arch: [arm64]
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  # No Developer ID: signed ad hoc after packing (scripts/adhoc-sign.js) — Gatekeeper then offers
  # "Open Anyway" instead of calling a downloaded copy damaged. A hardened runtime needs entitlements
  # (JIT) a real identity would bring, so it stays off with ad-hoc signing.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Robo-Architect-Lite-mac-${arch}.${ext}
afterPack: scripts/adhoc-sign.js

dmg:
  title: Robo Architect Lite
  artifactName: Robo-Architect-Lite-mac-${arch}.${ext}
  icon: resources/icons/icon.icns
  iconSize: 96
  window: { width: 540, height: 380 }
  contents:
    - { x: 140, y: 200, type: file }
    - { x: 400, y: 200, type: link, path: /Applications }

# Signing + notarize blocks are added in US1/T029.
# `publish` (update-feed) is added in US2/T032.
