<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Robo Architect</title>
<link rel="icon" href="/brand/ra-box-small.svg">
<link rel="stylesheet" href="shell.css">
<script>
  // before paint: the same theme setting the app's tabs use (same origin, key app_theme)
  try { const t = localStorage.getItem('app_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
</script>
</head>
<body>
  <header id="strip">
    <div id="lights"></div>
    <nav id="tabs" role="tablist"></nav>
    <button id="new-tab" class="strip-btn" title="홈 — 새로 열 것 고르기 (⌘T)" aria-label="새 탭"></button>
    <div class="strip-fill"></div>
    <div class="strip-right">
      <!-- 개발사 표시: 모든 탭 위에 늘 보이는 유엔진 로고 (Ontological Studio 와 같은 자리). -->
      <a class="strip-credit" href="https://www.uengine.org" target="_blank" rel="noopener" title="유엔진솔루션즈 개발 — www.uengine.org">
        <span class="strip-credit-mark" role="img" aria-label="uEngine"></span><span>유엔진솔루션즈 개발</span>
      </a>
      <button class="strip-btn" id="btn-theme" title="라이트/다크"></button>
      <button class="strip-btn" id="btn-window" title="새 창 (⌘N)"></button>
    </div>
  </header>

  <div id="home">
    <aside class="side">
      <div class="brand">
        <img class="brand-lockup" src="/brand/ra-lockup.svg" alt="Robo Architect">
        <span class="brand-badge">Lite</span>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-sep"></div>
      <div class="side-label">바로 열기</div>
      <nav class="side-nav" id="side-quick"></nav>
      <div class="side-fill"></div>
      <div class="status" id="status"></div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <div class="main-head">
          <h1 class="hello" id="hello">안녕하세요.<br>무엇을 설계하고 싶으신가요?</h1>
          <!-- C-4 ⑨ — 만들기는 모달로. 단추는 main 머리 오른쪽(탭 줄의 strip-right 와 헷갈리지 않게). -->
          <button class="btn primary" id="btn-create" disabled title="새 프로젝트(그래프)를 만듭니다"></button>
        </div>
        <p class="hello-sub">Robo Architect · Ontological DB(그래프 · 데이터 패브릭) · Claude Code — 모두 이 컴퓨터 안에서 돕니다.</p>

        <div class="svc-alert" id="svc-alert" role="status" hidden></div>
        <section class="project" id="project"></section>
        <div class="intent" id="intent" hidden></div>

        <div class="cards" id="cards"></div>

        <div class="list-bar">
          <div class="seg" id="seg" role="tablist"></div>
          <label class="search"><span id="search-icon"></span><input id="q" placeholder="이름으로 찾기…" spellcheck="false"></label>
          <span class="list-count" id="count"></span>
        </div>
        <div class="list">
          <table>
            <thead><tr><th>이름</th><th>종류</th><th>정보</th><th class="r">수정한 날짜</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden>아직 만든 것이 없습니다. 위에서 시작하세요.</div>
        </div>
      </div>
    </main>
  </div>
  <!-- 프로젝트 만들기 모달 (C-4 ⑨ · C-5 ⑩) — 프레임워크 없이 손으로. 열고 닫기는 shell.js -->
  <div class="modal-back" id="create-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="create-title">
      <h2 id="create-title">새 프로젝트</h2>
      <div class="pick-row"><span class="pick-label">이름</span>
        <input class="field" id="create-name" placeholder="영문 소문자 (예: food_delivery)" spellcheck="false" autocomplete="off">
      </div>
      <div class="pick-row top"><span class="pick-label">시작점</span>
        <div class="choices" id="create-type" role="radiogroup" aria-label="시작점">
          <button type="button" class="choice" role="radio" aria-checked="false" data-type="greenfield"><b>신규 시스템</b><small>그린필드 — 요구사항·프로포절부터 설계합니다</small></button>
          <button type="button" class="choice" role="radio" aria-checked="false" data-type="brownfield"><b>기존 시스템 있음</b><small>브라운필드 — 레거시 코드·DB 분석부터 시작합니다</small></button>
        </div>
      </div>
      <p class="modal-note">프로젝트마다 그래프가 따로 생깁니다 — 한 그래프 DB 안에서 섞이지 않습니다. 고른 시작점은 DDD 마법사의 프로젝트 유형 기본값이 됩니다.</p>
      <div class="pick-foot"><span class="msg" id="create-msg"></span>
        <button type="button" class="btn" data-modal="cancel">취소</button>
        <button type="button" class="btn primary" data-modal="create" disabled>만들기</button>
      </div>
    </div>
  </div>
  <script src="runtime-view.js"></script>
  <script src="shell.js"></script>
</body>
</html>
