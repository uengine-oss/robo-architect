<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Robo Architect</title>
<link rel="icon" href="/brand/ra-box-small.svg">
<link rel="stylesheet" href="shell.css">
<script>
  // before paint: the same theme setting the app's tabs use (same origin, key app_theme)
  try { const t = localStorage.getItem('app_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
</script>
</head>
<body>
  <header id="strip">
    <div id="lights"></div>
    <nav id="tabs" role="tablist"></nav>
    <button id="new-tab" class="strip-btn" title="홈 — 새로 열 것 고르기 (⌘T)" aria-label="새 탭"></button>
    <div class="strip-fill"></div>
    <div class="strip-right">
      <!-- 개발사 표시: 모든 탭 위에 늘 보이는 유엔진 로고 (Ontological Studio 와 같은 자리). -->
      <a class="strip-credit" href="https://www.uengine.org" target="_blank" rel="noopener" title="유엔진솔루션즈 개발 — www.uengine.org">
        <span class="strip-credit-mark" role="img" aria-label="uEngine"></span><span>유엔진솔루션즈 개발</span>
      </a>
      <button class="strip-btn" id="btn-theme" title="라이트/다크"></button>
      <button class="strip-btn" id="btn-window" title="새 창 (⌘N)"></button>
    </div>
  </header>

  <div id="home">
    <aside class="side">
      <div class="brand">
        <img class="brand-lockup" src="/brand/ra-lockup.svg" alt="Robo Architect">
        <span class="brand-badge">Lite</span>
      </div>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-sep"></div>
      <div class="side-label">바로 열기</div>
      <nav class="side-nav" id="side-quick"></nav>
      <div class="side-fill"></div>
      <div class="status" id="status"></div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <h1 class="hello" id="hello">안녕하세요.<br>무엇을 설계하고 싶으신가요?</h1>
        <p class="hello-sub">Robo Architect · Ontological DB(그래프 · 데이터 패브릭) · Claude Code — 모두 이 컴퓨터 안에서 돕니다.</p>

        <section class="project" id="project"></section>

        <div class="cards" id="cards"></div>

        <div class="list-bar">
          <div class="seg" id="seg" role="tablist"></div>
          <label class="search"><span id="search-icon"></span><input id="q" placeholder="이름으로 찾기…" spellcheck="false"></label>
          <span class="list-count" id="count"></span>
        </div>
        <div class="list">
          <table>
            <thead><tr><th>이름</th><th>종류</th><th>정보</th><th class="r">수정한 날짜</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty" hidden>아직 만든 것이 없습니다. 위에서 시작하세요.</div>
        </div>
      </div>
    </main>
  </div>
  <script src="shell.js"></script>
</body>
</html>
