# =====================================================================
# Robo Architect 서버 배포 (posco-web) — **DB 서버**
#
# ⚠ 이 파일은 `make-split.py` 가 `docker-compose.yml` 에서 만든다. 손으로 고치지 않는다.
#   고칠 것은 통합 파일에서 고치고 `python make-split.py` 를 다시 돌린다.
#
#   docker compose -f docker-compose.split.db.yml up -d --wait
#
# 두 서버의 `.env` 는 **같은 값**이어야 한다(.env.example 참고).
# 설명은 통합 파일의 주석과 README.md 에 있다.
# =====================================================================

name: robo-posco-web

x-labels: &labels
  org.uengine.robo.topology: posco-web

services:
  graph-db:
    image: ghcr.io/uengine-oss/robo-posco-graph-age:delivery
    restart: unless-stopped
    labels: *labels
    ports:
      - "${ROBO_DB_SERVER_IP:?}:${ROBO_DB_PG_PORT:-5432}:5432"
    environment:
      # Supabase 이미지는 POSTGRES_PASSWORD 를 supabase_admin · postgres 의 비밀번호로 쓴다(관리자 —
      # graph-init · authority-init 만 쓴다). 사용자 · DB 이름은 이미지 기본값이어야 Supabase 초기화
      # (역할 · DB graph · AGE)가 돈다 — 다른 값이면 조용히 건너뛴다(11-26 실측).
      POSTGRES_PASSWORD: ${ROBO_GRAPH_ADMIN_PASSWORD:?}
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_USER: supabase_admin
      POSTGRES_DB: postgres
    volumes:
      # **여기가 팀의 데이터 전부다.** 백업 대상이고, 지우면 되돌릴 수 없다.
      # Ontological 판의 graph_data 와 **다른 볼륨**이다 — 남겨 둔 그 볼륨이 되돌리기 자리다(이관 없음).
      - graph_age_data:/var/lib/postgresql/data
    healthcheck:
      # 떴고 · DB `graph` 에 AGE 가 있다(새 볼륨이면 이미지 초기화가 만든다)
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -q && psql -U supabase_admin -h 127.0.0.1 -d graph -Atc \"SELECT 1 FROM pg_extension WHERE extname='age'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  graph-init:
    image: ghcr.io/uengine-oss/robo-posco-graph-age:delivery
    restart: "no"
    labels: *labels
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        export PGPASSWORD="$$ADMIN_PASSWORD"
        P="psql -X -q -v ON_ERROR_STOP=1 -h graph-db -U supabase_admin -d graph"
        echo "graph-init: 앱 role $$APP_ROLE"
        $$P -v app="$$APP_ROLE" -v pw="$$APP_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'app') WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app') \gexec
        -- 사용자마다 role 을 만든다(read 격리) → CREATEROLE. 슈퍼유저는 아니다.
        SELECT format('ALTER ROLE %I WITH LOGIN NOSUPERUSER CREATEROLE NOCREATEDB NOREPLICATION NOBYPASSRLS PASSWORD %L', :'app', :'pw') \gexec
        SELECT format('GRANT CONNECT, CREATE ON DATABASE graph TO %I', :'app') \gexec
        SELECT format('GRANT USAGE, CREATE ON SCHEMA public TO %I', :'app') \gexec
        -- 게이트웨이가 graph · 라벨 이름을 찾는다 — 사용자 role(p_<사번>) 도. 이름만이고 데이터는 아니다.
        -- 사용자 role 도 DB 에 붙는다(데이터는 graph 스키마 GRANT 로만 열린다).
        -- 이 이미지는 새 DB 의 CONNECT 를 PUBLIC 에 주지 않는다.
        GRANT CONNECT ON DATABASE graph TO PUBLIC;
        GRANT USAGE ON SCHEMA ag_catalog TO PUBLIC;
        GRANT SELECT ON ag_catalog.ag_graph, ag_catalog.ag_label TO PUBLIC;
        SQL
        for g in "$$GRAPH_DESIGN" "$$GRAPH_ANALYSIS"; do
          # 앱 role 로 만든다 — AGE 는 graph 소유자만 라벨을 더한다(게이트웨이 README)
          PGPASSWORD="$$APP_PASSWORD" psql -X -q -v ON_ERROR_STOP=1 -h graph-db -U "$$APP_ROLE" -d graph -v g="$$g" <<'SQL'
        -- LOAD 'age' 는 슈퍼유저만 — 이미지가 shared_preload_libraries 로 미리 올린다
        SET search_path = ag_catalog, "$$user", public;
        SELECT format('SELECT ag_catalog.create_graph(%L)', :'g') WHERE NOT EXISTS (SELECT 1 FROM ag_catalog.ag_graph WHERE name = :'g') \gexec
        SQL
          echo "graph-init: graph $$g"
        done
        echo "graph-init: 끝"
    environment:
      ADMIN_PASSWORD: ${ROBO_GRAPH_ADMIN_PASSWORD:?}
      APP_ROLE: ${ROBO_GRAPH_USER:?}
      APP_PASSWORD: ${ROBO_GRAPH_PASSWORD:?}
      GRAPH_DESIGN: ${ROBO_GRAPH_DESIGN:?}
      GRAPH_ANALYSIS: ${ROBO_GRAPH_ANALYSIS:?}
    depends_on:
      graph-db:
        condition: service_healthy

  authority:
    image: ghcr.io/uengine-oss/robo-posco-authority:delivery
    restart: unless-stopped
    labels: *labels
    ports:
      - "${ROBO_DB_SERVER_IP:?}:${ROBO_AUTHORITY_PORT:-59020}:59020"
    environment: &authority-env
      AUTH_PROVIDER: swp
      AUTH_ENFORCE: "true"
      AUTH_DEV_LOGIN_ENABLED: "false"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      AUTH_ROLE_SECRET: ${AUTH_ROLE_SECRET:?}
      # 제한된 역할로만 붙는다. superuser 는 authority-init 에서만 한 번 쓴다.
      OG_PG_DSN: postgresql://robo_authority:${ROBO_AUTHORITY_DB_PASSWORD:?}@graph-db:5432/graph
      ROBO_GRAPH_ENGINE: age
      # 프로젝트 생성·공유(역할 생성 · graph 생성 · grant)는 **소유자 자격**으로 한다 — README §④.
      #   이 배치에서는 architect-api 가 이미 소유자 자격을 들고 있어(설치본 central 의 PC 와 같다)
      #   운영 역할을 따로 두어도 격리가 늘지 않는다. 런타임 역할(위)만 제한 역할이다.
      ROBO_PROJECT_OPERATOR_DSN: postgresql://${ROBO_GRAPH_USER:?}:${ROBO_GRAPH_PASSWORD:?}@graph-db:5432/graph
      # 비면 loopback 만 허용 → 서버 주소의 콜백이 거부된다. 반드시 채운다.
      AUTH_CALLBACK_ALLOWLIST: ${ROBO_PUBLIC_URL:?브라우저가 여는 주소(예 http://10.0.0.5:8080)}
      # 비우면 코드 기본값(SWP 가동계 주소)을 쓴다 — env_str 은 빈 값을 기본값으로 읽는다.
      SWP_SSO_LOGIN_URL: ${SWP_SSO_LOGIN_URL:-}
      SWP_SSO_VALID_CHECK_URL: ${SWP_SSO_VALID_CHECK_URL:-}
      SWP_SSO_REDIRECT_URL: ${SWP_SSO_REDIRECT_URL:-}
      SWP_IDX_ID: "0"
      SWP_IDX_EMPNO: "1"
      SWP_IDX_DISPLAYNAME: "8"
      SWP_IDX_MAIL: "9"
      SWP_IDX_DEPT: "4"
      SWP_EMAIL_FALLBACK_DOMAIN: posco.local
      SWP_SSO_TIMEOUT_S: "15"
    depends_on:
      authority-init:
        condition: service_completed_successfully

  authority-init:
    image: ghcr.io/uengine-oss/robo-posco-authority:delivery
    restart: "no"
    labels: *labels
    environment:
      <<: *authority-env
      # accounts_admin 은 슈퍼유저를 요구한다 → 관리자(supabase_admin)로 돌고, 만든 app_* 표 · 시퀀스는
      # **앱 role 에게 소유권을 넘긴다**(ROBO_APP_DB_ROLE) — 앱 role 이 소유자여야 앱이 쓴다.
      OG_PG_DSN: postgresql://supabase_admin:${ROBO_GRAPH_ADMIN_PASSWORD:?}@graph-db:5432/graph
      ROBO_APP_DB_ROLE: ${ROBO_GRAPH_USER:?}
      ROBO_AUTHORITY_DB_PASSWORD: ${ROBO_AUTHORITY_DB_PASSWORD:?}
      ROBO_ADMIN_EMPNO: ${ROBO_ADMIN_EMPNO:?최초 관리자 사번}
      ROBO_APPROVAL_REQUIRED: ${ROBO_APPROVAL_REQUIRED:-true}
    volumes:
      - ./authority-init.py:/app/authority_init.py:ro,z
    command: ["python", "/app/authority_init.py"]
    depends_on:
      graph-init:
        condition: service_completed_successfully

volumes:
  graph_age_data:
