      ROBO_EMBED_TIMEOUT_SECONDS: "180"
      ROBO_LLM_CONFIG: pgpt
      ROBO_LLM_MODEL_RUNTIME_CAPABILITIES_REF: llm/capabilities/gpt41_openai_2025_04_14.yaml
      ROBO_LLM_MODEL_RUNTIME_CAPABILITIES_SHA256: 09904ac41504b7128588dd32ef0f8c2dabf80366209bcad3bca6d2c730055df8
      ROBO_LLM_REPETITION_GUARD: "true"
      ROBO_LLM_RESPONSE_CACHE: "true"
      ROBO_LLM_RESPONSE_CACHE_MAX_MB: "512"
      ROBO_LLM_RESPONSE_CACHE_REQUIRE_HIT: "false"
      ROBO_NEO4J_RETRY_BACKOFF_SECONDS: "2"
      ROBO_NEO4J_RETRY_MAX_ATTEMPTS: "5"
      ROBO_PIPELINE_BATCH_MAX_TOKENS: "1500"
      ROBO_PIPELINE_EMBED_ENABLED: "true"
      ROBO_PIPELINE_LLM_MAX_CONCURRENCY: "32"
      ROBO_PIPELINE_MAX_CONCURRENCY: "64"
      ROBO_RUN_OUTPUT_DIR: /data/logs
      ROBO_RUNTIME_EVENT_FILE_ENABLED: "true"
      ROBO_RUNTIME_EVENT_LEVEL: INFO
      ROBO_SEARCH_ANCHOR_GAP: "0.12"
      ROBO_SEARCH_ANCHOR_TOP: "3"
      ROBO_SEARCH_CE_TOP: "15"
      ROBO_SEARCH_DENSE_IMPL: index
      ROBO_SEARCH_DIRECT_GAP: "0.12"
      ROBO_SEARCH_EVIDENCE_TOP: "15"
      ROBO_SEARCH_FETCH_K: "100"
      ROBO_SEARCH_HOP_GATE: "3"
      ROBO_SEARCH_LLM_CONFIG: gpt54_mini_openai
      ROBO_SEARCH_RANK_FLOOR: "2"
      ROBO_SEARCH_REWRITE: novel_abbrev
      ROBO_SEARCH_SELECTION: global_anchor
      ROBO_SEARCH_SUPPORT_POLICY: graph_gated
      ROBO_SEARCH_SUPPORT_ROOT_TOP: "12"
    volumes:
      - shared_data:/data
    depends_on:
      graph-bolt:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5502/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  parser:
    image: ghcr.io/uengine-oss/robo-posco-parser:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    environment:
      SERVER_PORT: "8081"
      ROBO_DATA_DIR: /data
      PARSER_REPAIR_AGENT_ENABLED: "false"
      PARSER_REPAIR_AGENT_MAX_OUTPUT_TOKENS: "2048"
      PARSER_REPAIR_AGENT_TIMEOUT_SECONDS: "120"
      PARSER_REPAIR_APPLY_TO_SOURCE: "false"
    volumes:
      - shared_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    image: ghcr.io/uengine-oss/robo-posco-gateway:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    environment:
      SERVER_PORT: "9000"
      ROBO_ANTLR_URL: http://parser:8081
      ROBO_ANALYZER_URL: http://analyzer:5502
      ROBO_CATALOG_URL: http://catalog:5503
      ROBO_DATA_FABRIC_URL: http://fabric:8404
      ROBO_ARCHITECT_URL: http://architect-api:8000
    depends_on:
      analyzer:
        condition: service_healthy
      catalog:
        condition: service_healthy
      fabric:
        condition: service_healthy
      parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  # ── 문서→BPMN · 와이어프레임 렌더러 ───────────────────────────────────
  pdf2bpmn:
    image: ghcr.io/uengine-oss/robo-posco-pdf2bpmn:735d135
    platform: linux/amd64
    restart: unless-stopped
    labels: *labels
    # 이미지의 entrypoint.sh 는 자기 스택을 띄운다. compose 의 command 는 CMD 만 덮으므로
    # entrypoint 를 덮어야 우리 facade 가 뜬다(설치본 compose 주석).
    entrypoint: ["sh", "-c", "cd /app && PYTHONPATH=/app:/facade exec uvicorn facade:app --host 0.0.0.0 --port 8080"]
    volumes:
      - ./pdf2bpmn/facade.py:/facade/facade.py:ro
    environment:
      PYTHONIOENCODING: utf-8
      OPENAI_API_KEY: ${ROBO_AI_API_KEY:?}
      OPENAI_BASE_URL: ${ROBO_AI_BASE_URL:?}
      PGPT_BASE_URL: ${ROBO_AI_BASE_URL:?}
      PGPT_API_KEY: ${ROBO_AI_API_KEY:?}
      LLM_MODEL: gpt-4.1
      FACADE_API_KEY: ${PDF2BPMN_FACADE_KEY:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  wireframe:
    image: ghcr.io/uengine-oss/robo-posco-wireframe:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    environment:
      WIREFRAME_SERVICE_PORT: "7610"
      COMPONENT_LIBRARY_PATH: /app/docs/components.fig
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:7610/health');if(!r.ok)process.exit(1);const j=await r.json();process.exit(j.status==='ok'?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  graph_data:
  shared_data:
  workspace:
