    output_per_1m: 0.0

  # ── Qwen (OpenRouter 또는 자체 호스팅) ─────────────────────
  qwen-3-8b:
    input_per_1m: 0.06
    output_per_1m: 0.20
  qwen-3-32b:
    input_per_1m: 0.30
    output_per_1m: 0.80
  qwen-3-72b:
