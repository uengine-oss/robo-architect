  claude-3-5-sonnet-20241022:
    input_per_1m: 3.0
    output_per_1m: 15.0
    cached_input_per_1m: 0.30
  claude-sonnet-4:
    input_per_1m: 3.0
    output_per_1m: 15.0
    cached_input_per_1m: 0.30
  claude-opus-4:
