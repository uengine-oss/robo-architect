  # ── OpenAI ─────────────────────────────────────────────────
  # gpt-4.1 — POSCO 납품판이 쓰는 모델(pgpt.yaml · openai_gpt41.yaml 둘 다 `model: gpt-4.1`).
  # 봉인은 revision 을 gpt-4.1-2025-04-14 로 박지만 lookup_price 가 날짜 꼬리를 떼므로
  # 키는 `gpt-4.1` 하나로 족하다. 출처: OpenAI 모델 페이지(2026-11-12 확인).
  gpt-4.1:
    input_per_1m: 2.00
