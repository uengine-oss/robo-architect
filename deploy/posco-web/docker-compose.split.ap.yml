# =====================================================================
# Robo Architect 서버 배포 (posco-web) — **AP 서버**
#
# ⚠ 이 파일은 `make-split.py` 가 `docker-compose.yml` 에서 만든다. 손으로 고치지 않는다.
#   고칠 것은 통합 파일에서 고치고 `python make-split.py` 를 다시 돌린다.
#
#   docker compose -f docker-compose.split.ap.yml up -d --wait
#
# 두 서버의 `.env` 는 **같은 값**이어야 한다(.env.example 참고).
# 설명은 통합 파일의 주석과 README.md 에 있다.
# =====================================================================

name: robo-posco-web

x-labels: &labels
  org.uengine.robo.topology: posco-web

services:
  web:
    image: ghcr.io/uengine-oss/robo-posco-web:posco-web-30463c2
    restart: unless-stopped
    labels: *labels
    environment:
      ARCHITECT_API_UPSTREAM: architect-api:8000
    ports:
      - "${ROBO_WEB_BIND:-0.0.0.0}:${ROBO_WEB_PORT:-8080}:8080"
    depends_on:
      architect-api:
        condition: service_healthy

  architect-api:
    image: ghcr.io/uengine-oss/robo-posco-architect-api:posco-web-30463c2
    restart: unless-stopped
    labels: *labels
    # 메모리 상한 손잡이 — 기본 **0 = 제한 없음**(지금 동작 그대로).
    # 한 대에 열한 서비스가 같이 사니, 분석 하나가 번지면 같은 서버의 DB 까지 굶는다.
    # 걸 값과 잰 값은 .env.example 의 `ROBO_MEM_*` 절에 적어 두었다.
    mem_limit: ${ROBO_MEM_API:-0}
    environment:
      # 서버 판 고정값 — 바꾸지 않는다.
      #   central  여럿이 한 저장소를 쓴다. 이미 있는 사용자 role 의 비밀번호를
      #            덮지 않는다(projects/roles.py). 통합 서버도 여럿이 쓰므로 central 이다.
      ROBO_GRAPH_MODE: central
      ROBO_PACKAGED_RUNTIME: "1"
      # 요청마다 로그인한 사람의 role 로 그래프에 붙는다. 설치본 `.env` 는 false 였지만
      # Electron 이 프로세스 환경으로 true 를 넣어 **실효값은 true** 였다(backend.ts).
      AUTH_BIND_CONNECTION: "true"
      AUTH_PROVIDER: swp
      AUTH_ENFORCE: "true"
      AUTH_DEV_LOGIN_ENABLED: "false"
      ROBO_AUTHORITY_URL: http://${ROBO_DB_SERVER_IP:?}:${ROBO_AUTHORITY_PORT:-59020}
      # 설치본의 PC 마다 넣던 두 값(사용자-설치-가이드 §3 · robo-env.ps1)과 **같은 값**이다.
      #   AUTH_ROLE_SECRET  로그인한 사람의 DB role 비밀번호 = HMAC(이 값, 사번). 요청마다
      #                     그 role 로 붙으므로(AUTH_BIND_CONNECTION) 없으면 프로젝트를 못 연다.
      #                     중앙 구성에서는 JWT 비밀로 대신하지 않는다(projects/roles.py)
      #   AUTH_JWT_SECRET   토큰 검증은 authority 에 묻지만, PC 와 같은 자세로 둔다
      AUTH_ROLE_SECRET: ${AUTH_ROLE_SECRET:?}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      # 그래프 — 설계 graph 와 분석 graph 는 **달라야 한다**(같으면 분석이 설계를 지운다).
      NEO4J_URI: bolt://${ROBO_DB_SERVER_IP:?}:${ROBO_DB_BOLT_PORT:-7687}
      NEO4J_USER: ${ROBO_GRAPH_USER:?}
      NEO4J_PASSWORD: ${ROBO_GRAPH_PASSWORD:?}
      NEO4J_DATABASE: ${ROBO_GRAPH_DESIGN:?}
      ANALYZER_NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS:?}
      OG_PG_HOST: ${ROBO_DB_SERVER_IP:?}
      OG_PG_PORT: ${ROBO_DB_PG_PORT:-5432}
      OG_PG_DATABASE: ${ROBO_GRAPH_DESIGN:?}
      OG_PG_USER: ${ROBO_GRAPH_USER:?}
      OG_PG_PASSWORD: ${ROBO_GRAPH_PASSWORD:?}
      # 안쪽 서비스 — 설치본은 127.0.0.1:<동적포트> 였다(docker-stack.ts).
      ROBO_GATEWAY_URL: http://gateway:9000
      ROBO_CLUSTER_MCP_URL: http://analyzer:5502/robo/mcp/
      WIREFRAME_SERVICE_URL: http://wireframe:7610
      ROBO_SPEC_BACKEND_URL: http://127.0.0.1:8000
      # AI — 사내 P-GPT 로만 나간다.
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4.1
      LLM_API_BASE: ${ROBO_AI_BASE_URL:?}
      OPENAI_BASE_URL: ${ROBO_AI_BASE_URL:?}
      OPENAI_API_KEY: ${ROBO_AI_API_KEY:?}
      EMBEDDING_API_KEY: ${ROBO_AI_API_KEY:?}
      EMBEDDING_MODEL: text-embedding-3-small
      HYBRID_EMBEDDING_MODEL: text-embedding-3-small
      LLM_MAX_COMPLETION_TOKENS: "4096"
      LLM_MAX_OUTPUT_TOKENS: "8000"
      LLM_READ_TIMEOUT_S: "120"
      LLM_TOKENIZER_FALLBACK: tiktoken
      MODEL_KWARGS: '{"temperature":0.3}'
      MODEL_MODIFIER_CONTEXT_CHARS_LIMIT: "100000"
      # 납품본 architect/app/.env 의 제품 설정 — 그대로 옮겼다.
      AI_AUDIT_LOG_ENABLED: "true"
      AI_AUDIT_LOG_FULL_OUTPUT: "false"
      AI_AUDIT_LOG_FULL_PROMPT: "false"
      BC_SPEC_SPLIT_LINE_THRESHOLD: "800"
      CHANGE_PROPAGATION_CONFIRMED_THRESHOLD: "0.70"
      CHANGE_PROPAGATION_ENABLED: "true"
      CHANGE_PROPAGATION_MAX_CONFIRMED: "60"
      CHANGE_PROPAGATION_MAX_FRONTIER_PER_ROUND: "8"
      CHANGE_PROPAGATION_MAX_NEW_PER_ROUND: "20"
      CHANGE_PROPAGATION_MAX_ROUNDS: "4"
      CHANGE_PROPAGATION_REL_WHITELIST: IMPLEMENTS,HAS_AGGREGATE,HAS_COMMAND,EMITS,HAS_POLICY,TRIGGERS,INVOKES
      CHANGE_PROPAGATION_REVIEW_THRESHOLD: "0.40"
      GENERATION_LANGUAGE_DEFAULT: en-US
      HYBRID_EMBED_THETA_AUTO: "0.5"
      HYBRID_EMBED_THETA_REVIEW: "0.4"
      HYBRID_EMBED_TOP_K: "3"
      HYBRID_ES_FN_DF_THRESHOLD: "0.5"
      HYBRID_GLOSSARY_MAX_RECOVERIES: "4"
      HYBRID_GLOSSARY_NORMALIZE: "1"
      HYBRID_LEXICAL_MAX_TOKEN_DF: "0.35"
      HYBRID_LEXICAL_MIN_HITS: "2"
      HYBRID_PASSAGE_THETA: "0.5"
      HYBRID_PASSAGE_TOP_K: "2"
      # pdf2bpmn 을 뺐으므로 1단계는 native 추출기로 간다. **끄지 않으면** a2a 를
      # PDF2BPMN_A2A_URL 기본값(localhost:9999)에서 찾다가 문서마다 기다린다.
      HYBRID_USE_A2A: "false"
      INGESTION_BATCH_SIZE: "500"
      INGESTION_CACHE_DEFAULT: "1"
      INGESTION_SNAPSHOT_DEBUG: "0"
      IS_SKIP_UI_PHASE: "false"
      WIREFRAME_LLM_CONCURRENCY: "4"
      WIREFRAME_LLM_TIMEOUT_SEC: "300"
    volumes:
      # 코드 생성·제안 구현의 대상 프로젝트가 놓이는 **서버 쪽** 자리(README §결정 ①).
      - workspace:/workspace
    depends_on:
      gateway:
        condition: service_healthy

  fabric:
    image: ghcr.io/uengine-oss/robo-posco-fabric:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    environment:
      NEO4J_URI: bolt://${ROBO_DB_SERVER_IP:?}:${ROBO_DB_BOLT_PORT:-7687}
      NEO4J_USER: ${ROBO_GRAPH_USER:?}
      NEO4J_PASSWORD: ${ROBO_GRAPH_PASSWORD:?}
      NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS:?}
      DATA_FABRIC_ALLOW_NEO4J_HEADER_OVERRIDE: "true"
      DATA_FABRIC_QUERY_TIMEOUT_SECONDS: "30"
      OPENAI_API_KEY: ${ROBO_AI_API_KEY:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8404/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  catalog:
    image: ghcr.io/uengine-oss/robo-posco-catalog:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    environment:
      NEO4J_URI: bolt://${ROBO_DB_SERVER_IP:?}:${ROBO_DB_BOLT_PORT:-7687}
      NEO4J_USER: ${ROBO_GRAPH_USER:?}
      NEO4J_PASSWORD: ${ROBO_GRAPH_PASSWORD:?}
      NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS:?}
      DATA_FABRIC_URL: http://fabric:8404
      CATALOG_ALLOW_NEO4J_HEADER_OVERRIDE: "true"
      OPENAI_API_KEY: ${ROBO_AI_API_KEY:?}
      LLM_API_KEY: ${ROBO_AI_API_KEY:?}
      LLM_API_BASE: ${ROBO_AI_BASE_URL:?}
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4.1
      LLM_MAX_COMPLETION_TOKENS: "4096"
      LLM_MAX_OUTPUT_TOKENS: "8000"
      LLM_READ_TIMEOUT_S: "120"
      LLM_TOKENIZER_FALLBACK: tiktoken
      EMBEDDING_MODEL: text-embedding-3-small
      CATALOG_DISCOVERY_SNAPSHOT_CAPACITY: "256"
      CATALOG_DISCOVERY_SNAPSHOT_TTL_SECONDS: "900"
      FK_CONCURRENCY: "5"
      FK_INFERENCE_ENABLED: "true"
      FK_MATCH_RATIO_THRESHOLD: "0.8"
      FK_SAMPLE_SIZE: "25"
      FK_SIMILARITY_THRESHOLD: "0.8"
      METADATA_TIMEOUT_CONNECT: "5"
      METADATA_TIMEOUT_REQUEST: "30"
    depends_on:
      fabric:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5503/robo/check-data/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  analyzer:
    image: ghcr.io/uengine-oss/robo-posco-analyzer:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    mem_limit: ${ROBO_MEM_ANALYZER:-0}
    environment:
      ROBO_NEO4J_URI: bolt://${ROBO_DB_SERVER_IP:?}:${ROBO_DB_BOLT_PORT:-7687}
      ROBO_NEO4J_USER: ${ROBO_GRAPH_USER:?}
      ROBO_NEO4J_PASSWORD: ${ROBO_GRAPH_PASSWORD:?}
      ROBO_NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS:?}
      NEO4J_URI: bolt://${ROBO_DB_SERVER_IP:?}:${ROBO_DB_BOLT_PORT:-7687}
      NEO4J_USER: ${ROBO_GRAPH_USER:?}
      NEO4J_PASSWORD: ${ROBO_GRAPH_PASSWORD:?}
      NEO4J_DATABASE: ${ROBO_GRAPH_ANALYSIS:?}
      ROBO_CATALOG_BASE_URL: http://catalog:5503/robo
      ROBO_DATA_DIR: /data
      ROBO_LLM_API_KEY: ${ROBO_AI_API_KEY:?}
      ROBO_EMBED_API_KEY: ${ROBO_AI_API_KEY:?}
      ROBO_SEARCH_LLM_API_KEY: ${ROBO_AI_API_KEY:?}
      ROBO_EMBED_API_BASE: ${ROBO_AI_BASE_URL:?}
      # 납품본 config/analyzer.env 의 제품 설정 — 그대로 옮겼다.
      ROBO_BUDGET_RUN_USD: "20"
      ROBO_CATALOG_ENABLED: "true"
      ROBO_CATALOG_TIMEOUT_SECONDS: "120"
      ROBO_EMBED_CHAR_BUDGET: "700"
      ROBO_EMBED_CONCURRENCY: "8"
      ROBO_EMBED_MAX_RETRIES: "6"
      ROBO_EMBED_MODEL: text-embedding-3-small
      ROBO_EMBED_PROVIDER: openai
      ROBO_EMBED_TIMEOUT_SECONDS: "180"
      # pgpt = 사내 P-GPT(이미지 안 파일) · openai_gpt41 = OpenAI 직결(아래 마운트한 파일).
      # 둘 다 gpt-4.1 이라 위·아래의 능력 봉인과 맞는다. 주소를 env 로 덮는 길이 analyzer 에 없어 파일로 고른다.
      ROBO_LLM_CONFIG: ${ROBO_ANALYZER_LLM_CONFIG:-pgpt}
      ROBO_LLM_MODEL_RUNTIME_CAPABILITIES_REF: llm/capabilities/gpt41_openai_2025_04_14.yaml
      ROBO_LLM_MODEL_RUNTIME_CAPABILITIES_SHA256: 09904ac41504b7128588dd32ef0f8c2dabf80366209bcad3bca6d2c730055df8
      ROBO_LLM_REPETITION_GUARD: "true"
      ROBO_LLM_RESPONSE_CACHE: "true"
      ROBO_LLM_RESPONSE_CACHE_MAX_MB: "512"
      ROBO_LLM_RESPONSE_CACHE_REQUIRE_HIT: "false"
      ROBO_NEO4J_RETRY_BACKOFF_SECONDS: "2"
      ROBO_NEO4J_RETRY_MAX_ATTEMPTS: "5"
      ROBO_PIPELINE_BATCH_MAX_TOKENS: "1500"
      ROBO_PIPELINE_EMBED_ENABLED: "true"
      ROBO_PIPELINE_LLM_MAX_CONCURRENCY: "32"
      ROBO_PIPELINE_MAX_CONCURRENCY: "64"
      ROBO_RUN_OUTPUT_DIR: /data/logs
      ROBO_RUNTIME_EVENT_FILE_ENABLED: "true"
      ROBO_RUNTIME_EVENT_LEVEL: INFO
      ROBO_SEARCH_ANCHOR_GAP: "0.12"
      ROBO_SEARCH_ANCHOR_TOP: "3"
      ROBO_SEARCH_CE_TOP: "15"
      ROBO_SEARCH_DENSE_IMPL: index
      ROBO_SEARCH_DIRECT_GAP: "0.12"
      ROBO_SEARCH_EVIDENCE_TOP: "15"
      ROBO_SEARCH_FETCH_K: "100"
      ROBO_SEARCH_HOP_GATE: "3"
      # 검색(질의 번역)용 설정 — **분석용과 같은 갈래로 둔다.** 납품본 config/analyzer.env 는
      # `pgpt` 인데 여기에는 `gpt54_mini_openai`(api_base = https://api.openai.com/v1)가
      # 적혀 있었다. 돌아가는 분석기에서 이 이름을 읽는 곳은 tests/eval/gate_eval.py 하나라
      # 실효는 없었지만(2026-11-11 측정), 사내 키(ROBO_SEARCH_LLM_API_KEY)가 본점 주소를
      # 가리키는 설정 옆에 놓이는 자리였다. check.sh 가 yml 의 모든 *_LLM_CONFIG 를 본다.
      ROBO_SEARCH_LLM_CONFIG: ${ROBO_ANALYZER_LLM_CONFIG:-pgpt}
      ROBO_SEARCH_RANK_FLOOR: "2"
      ROBO_SEARCH_REWRITE: novel_abbrev
      ROBO_SEARCH_SELECTION: global_anchor
      ROBO_SEARCH_SUPPORT_POLICY: graph_gated
      ROBO_SEARCH_SUPPORT_ROOT_TOP: "12"
    volumes:
      - shared_data:/data
      - ./analyzer-llm/openai_gpt41.yaml:/app/llm/configs/openai_gpt41.yaml:ro
    depends_on:
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5502/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  parser:
    image: ghcr.io/uengine-oss/robo-posco-parser:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    mem_limit: ${ROBO_MEM_PARSER:-0}
    environment:
      SERVER_PORT: "8081"
      ROBO_DATA_DIR: /data
      PARSER_REPAIR_AGENT_ENABLED: "false"
      PARSER_REPAIR_AGENT_MAX_OUTPUT_TOKENS: "2048"
      PARSER_REPAIR_AGENT_TIMEOUT_SECONDS: "120"
      PARSER_REPAIR_APPLY_TO_SOURCE: "false"
    volumes:
      - shared_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  gateway:
    image: ghcr.io/uengine-oss/robo-posco-gateway:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    mem_limit: ${ROBO_MEM_GATEWAY:-0}
    environment:
      SERVER_PORT: "9000"
      ROBO_ANTLR_URL: http://parser:8081
      ROBO_ANALYZER_URL: http://analyzer:5502
      ROBO_CATALOG_URL: http://catalog:5503
      ROBO_DATA_FABRIC_URL: http://fabric:8404
      ROBO_ARCHITECT_URL: http://architect-api:8000
    depends_on:
      analyzer:
        condition: service_healthy
      catalog:
        condition: service_healthy
      fabric:
        condition: service_healthy
      parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  wireframe:
    image: ghcr.io/uengine-oss/robo-posco-wireframe:0.1.0-wde10ff6c-afff41f36-scda199-rdel-swp
    restart: unless-stopped
    labels: *labels
    environment:
      WIREFRAME_SERVICE_PORT: "7610"
      COMPONENT_LIBRARY_PATH: /app/docs/components.fig
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:7610/health');if(!r.ok)process.exit(1);const j=await r.json();process.exit(j.status==='ok'?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  shared_data:
  workspace:
