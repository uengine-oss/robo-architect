# 고객·판 행렬 — "브랜치 하나, 고객은 빌드 입력" 이 깨지지 않는지 매 push 마다 본다.
#
# 단일 브랜치 통합 설계 §3-3:
#   빌드 행렬      CUSTOMER ∈ {default, posco} × EDITION ∈ {web, desktop} 를 굽는다
#   새는 문자열 0  default 빌드 번들에 고객 문자열(poscodx · swpsso · searchDataDictionary · 설계_ …)이 없다
#   확장 등록부    없는 고객은 기동을 멈추고, 고른 고객 하나만 읽는다(api/tests/test_extensions.py)
#
# 포스코 동작 고정(골든 e2e)은 P5 에서 더한다 — 그때까지 현장 판은 posco-web 브랜치에서 굽는다.
name: customer-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 등록부는 표준 라이브러리만 쓴다 — 무거운 의존성 없이 돈다.
      - run: pip install pytest
      - run: python -m pytest -q api/tests/test_extensions.py

  web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        customer: [default, posco]
        edition: [web, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # vite.config.js 가 ../open-pencil(서브모듈)을 읽는다. LFS 는 시험용 자료뿐이라 받지 않는다.
      - name: open-pencil 서브모듈
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git submodule update --init --depth 1 -- open-pencil
          test -f open-pencil/package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - run: cd open-pencil && bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-audit --no-fund
      - name: 빌드 (${{ matrix.customer }} × ${{ matrix.edition }})
        env:
          VITE_CUSTOMER: ${{ matrix.customer }}
          VITE_EDITION: ${{ matrix.edition }}
        run: cd frontend && npx vite build --outDir ../dist-${{ matrix.customer }}-${{ matrix.edition }}
      - name: 고객 문자열 누출 0 (default 만)
        if: matrix.customer == 'default'
        run: node scripts/check-customer-leaks.mjs dist-${{ matrix.customer }}-${{ matrix.edition }}
      - name: 없는 고객은 빌드가 멈춘다
        if: matrix.customer == 'default' && matrix.edition == 'web'
        run: |
          if (cd frontend && VITE_CUSTOMER=no_such_customer npx vite build --outDir ../dist-x); then
            echo "::error::없는 고객으로 빌드가 통과했다 — 기본 판이 조용히 나갈 수 있다"; exit 1
          fi
